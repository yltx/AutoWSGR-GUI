  <!-- 出征规划：加载作战计划 -->
  <div id="battle-plan-loader" class="modal-overlay" style="display:none">
    <div class="modal card fleet-team-loader-dialog battle-plan-loader-dialog">
      <div class="fleet-dialog-header">
        <div class="fleet-dialog-heading">
          <h3 id="battle-plan-loader-title">加载出征配置</h3>
          <p id="battle-plan-loader-description">读取系统与用户作战计划目录中的合法 YAML 配置。</p>
        </div>
        <div class="fleet-team-loader-header-actions">
          <span id="battle-plan-loader-count">共读取 0 个作战计划</span>
          <button class="btn btn-small" id="btn-refresh-battle-plan-loader" type="button">刷新</button>
        </div>
      </div>
      <input
        class="input"
        id="battle-plan-loader-search"
        type="search"
        placeholder="搜索配置名称或关卡"
        autocomplete="off"
      >
      <div class="fleet-team-loader-content battle-plan-loader-content">
        <div class="fleet-team-loader-list" id="battle-plan-loader-list"></div>
        <div class="fleet-team-loader-preview-column">
          <div class="fleet-team-loader-tools">
            <div class="fleet-team-loader-system-filter">
              <span>过滤系统预设</span>
              <label class="config-switch">
                <input type="checkbox" id="battle-plan-loader-filter-system">
                <span class="config-switch-track" aria-hidden="true"></span>
              </label>
            </div>
            <div class="fleet-team-loader-sort">
              <span>排序方式</span>
              <div class="fleet-team-loader-sort-controls">
                <div class="fleet-team-loader-sort-fields">
                  <button
                    class="fleet-team-loader-sort-option"
                    data-battle-plan-sort-field="name"
                    type="button"
                  >名称</button>
                  <button
                    class="fleet-team-loader-sort-option active"
                    data-battle-plan-sort-field="modifiedAt"
                    type="button"
                  >修改时间</button>
                </div>
                <label class="fleet-sort-direction">
                  <span>倒序</span>
                  <input type="checkbox" id="battle-plan-loader-sort-asc">
                  <span class="fleet-sort-track" aria-hidden="true"></span>
                  <span>正序</span>
                </label>
              </div>
            </div>
          </div>
          <div class="fleet-team-loader-preview battle-plan-loader-preview">
            <div class="battle-plan-preview-heading">
              <h3 id="battle-plan-loader-preview-title">配置预览：未选择</h3>
              <span id="battle-plan-loader-preview-source" class="fleet-team-source-badge user" hidden></span>
            </div>
            <div id="battle-plan-loader-preview-body" class="battle-plan-preview-body">
              <div class="fleet-team-loader-preview-empty">从左侧选择一个出征配置查看摘要</div>
            </div>
          </div>
        </div>
      </div>
      <p class="fleet-dialog-status" id="battle-plan-loader-status" hidden></p>
      <div class="modal-actions">
        <button class="btn" id="btn-cancel-battle-plan-loader" type="button">取消</button>
        <button class="btn" id="btn-import-local-battle-plan" type="button">添加本地 YAML</button>
        <button class="btn btn-primary" id="btn-confirm-battle-plan-loader" type="button" disabled>加载</button>
      </div>
    </div>
  </div>
