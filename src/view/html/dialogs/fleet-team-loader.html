  <!-- 舰队规划：加载编队预设 -->
  <div id="fleet-team-loader" class="modal-overlay" style="display:none">
    <div class="modal card fleet-team-loader-dialog">
      <div class="fleet-dialog-header">
        <div class="fleet-dialog-heading">
          <h3>加载舰队预设</h3>
          <p>读取系统与用户编队目录中的合法 team-*.yaml 配置。</p>
        </div>
        <div class="fleet-team-loader-header-actions">
          <span id="fleet-team-loader-count">共读取 0 个舰队预设</span>
          <button class="btn btn-small" id="btn-refresh-team-loader" type="button">刷新</button>
        </div>
      </div>
      <input
        class="input"
        id="fleet-team-loader-search"
        type="search"
        placeholder="搜索预设名称"
        autocomplete="off"
      >
      <div class="fleet-team-loader-content">
        <div class="fleet-team-loader-list" id="fleet-team-loader-list"></div>
        <div class="fleet-team-loader-preview-column">
          <div class="fleet-team-loader-tools">
            <div class="fleet-team-loader-system-filter">
              <span>过滤系统预设</span>
              <label class="config-switch">
                <input type="checkbox" id="fleet-team-loader-filter-system" checked>
                <span class="config-switch-track" aria-hidden="true"></span>
              </label>
            </div>
            <div class="fleet-team-loader-sort">
              <span>排序方式</span>
              <div class="fleet-team-loader-sort-controls">
                <div class="fleet-team-loader-sort-fields">
                  <button
                    class="fleet-team-loader-sort-option"
                    data-team-loader-sort-field="name"
                    type="button"
                  >名称</button>
                  <button
                    class="fleet-team-loader-sort-option active"
                    data-team-loader-sort-field="modifiedAt"
                    type="button"
                  >修改时间</button>
                </div>
                <label class="fleet-sort-direction">
                  <span>倒序</span>
                  <input type="checkbox" id="fleet-team-loader-sort-asc">
                  <span class="fleet-sort-track" aria-hidden="true"></span>
                  <span>正序</span>
                </label>
              </div>
            </div>
          </div>
          <div class="fleet-team-loader-preview fleet-team-preview">
            <div class="fleet-team-preview-heading">
              <h3 id="fleet-team-loader-preview-title">编队预览：未选择</h3>
              <p class="fleet-team-preview-hint">点击主编队位置，查看该位置对应的备选队列。</p>
            </div>
            <div id="fleet-team-loader-preview-slots" class="fleet-team-main-preview"></div>
            <h4 id="fleet-team-loader-backup-title">【位置1】的备选队列</h4>
            <div id="fleet-team-loader-backup-slots" class="fleet-team-backup-preview"></div>
          </div>
        </div>
      </div>
      <p class="fleet-dialog-status" id="fleet-team-loader-status"></p>
      <div class="modal-actions">
        <button class="btn" id="btn-cancel-team-loader" type="button">取消</button>
        <button class="btn btn-primary" id="btn-confirm-team-loader" type="button" disabled>加载</button>
      </div>
    </div>
  </div>
