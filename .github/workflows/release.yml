name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $pkg = Get-Content package.json | ConvertFrom-Json
            $ver = $pkg.version
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+-alpha(?:\.\d+)?$') {
            throw "版本 $ver 不符合 X.Y.Z-alpha 或 X.Y.Z-alpha.N"
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "CHANNEL=alpha" >> $env:GITHUB_OUTPUT
          echo "Resolved Alpha version: $ver"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync package.json version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.version = "${{ steps.version.outputs.VERSION }}"
          $pkg.build.publish.owner = "ShiinaKuroko"
          $pkg.build.publish.repo = "AutoWSGR-GUI"
          $pkg.build.publish | Add-Member `
            -NotePropertyName channel `
            -NotePropertyValue "${{ steps.version.outputs.CHANNEL }}" `
            -Force
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json -Encoding UTF8

      - name: Pin latest Alpha backend
        shell: pwsh
        run: |
          $backendRepository = "ShiinaKuroko/AutoWSGR"
          $backendRef = "ShiinaKuroko"
          $remote = git ls-remote `
            "https://github.com/$backendRepository.git" `
            "refs/heads/$backendRef"
          $backendCommit = ($remote -split '\s+')[0]
          if ($backendCommit -notmatch '^[0-9a-f]{40}$') {
            throw "无法解析 $backendRepository@$backendRef 的提交"
          }
          $manifest = Get-Content build/backend-distribution.json |
            ConvertFrom-Json
          $manifest.id = "alpha"
          $manifest.repository = $backendRepository
          $manifest.ref = $backendRef
          $manifest.commit = $backendCommit
          $manifest.forceUpdateOnInstall = $true
          $manifest | ConvertTo-Json -Depth 10 |
            Set-Content build/backend-distribution.json -Encoding UTF8
          echo "Pinned backend: $backendRepository@$backendCommit"

      - name: Build & Package
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release artifacts
        shell: pwsh
        run: Get-ChildItem -Path release -Recurse -File | Select-Object FullName, Length

      - name: Verify packaged runtime and resources
        run: npm run test:release-package

      - name: Verify update channel metadata
        shell: pwsh
        run: |
          $alphaRelease = Join-Path release "alpha"
          $expected = Join-Path $alphaRelease "alpha.yml"
          if (-not (Test-Path $expected)) {
            throw "缺少 Alpha 更新清单: $expected"
          }
          @('latest', 'beta', 'dev') |
            ForEach-Object {
              $unexpected = Join-Path $alphaRelease "$_.yml"
              if (Test-Path $unexpected) {
                throw "发布产物混入其他频道清单: $unexpected"
              }
            }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: AutoWSGR-GUI v${{ steps.version.outputs.VERSION }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/alpha/AutoWSGR-GUI-Setup-*.exe
            release/alpha/*.exe.blockmap
            release/alpha/alpha.yml
          body: |
            ## AutoWSGR-GUI v${{ steps.version.outputs.VERSION }}

            ### 使用方法
            1. 下载 `AutoWSGR-GUI-Setup-*.exe`
            2. 软件已内置 Python 3.12，无需单独安装
            3. 首次运行时程序会自动安装 Python 依赖（需联网）
            4. 已安装用户将自动收到增量更新提示

            ### 系统要求
            - Windows 10/11 x64
            - 网络连接（首次运行需安装 pip 依赖）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
